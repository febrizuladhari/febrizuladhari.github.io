<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <meta name="description" content="Personal website and portfolio of Febri.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=DM+Mono&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-md nav-b sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">febri<span class="ac">.</span></a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nv" aria-label="Menu"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="nv">
                <ul class="navbar-nav ms-auto align-items-md-center gap-md-1">
                    <li><a class="nav-link" href="index.html" data-i18n="n_home">Home</a></li>
                    <li><a class="nav-link" href="about.html" data-i18n="n_about">About</a></li>
                    <li><a class="nav-link" href="portfolio.html" data-i18n="n_work">Work</a></li>
                    <li><a class="nav-link" href="hobbies.html" data-i18n="n_hobby">Hobbies</a></li>
                    <li><a class="nav-link" href="contact.html" data-i18n="n_contact">Contact</a></li>
                    <li class="ms-md-2 my-2 my-md-0"><button class="lang-btn" aria-label="Switch language">ID</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <section class="container py-5">
            <div class="row g-5">
                <div class="col-lg-6 rv">
                    <h1 class="big mb-3" style="font-size:clamp(2.8rem,9vw,6rem)" data-i18n="c_h">Let's talk</h1>
                    <p class="fs-5 mb-4" data-i18n="c_s"></p>
                    <p class="mono mb-2" data-i18n="c_f">Find me</p>
                    <a class="btn-b me-2 mb-2" href="mailto:you@example.com">Email</a><a class="btn-b alt me-2 mb-2"
                        href="https://github.com/USERNAME">GitHub</a><a class="btn-b alt me-2 mb-2"
                        href="https://linkedin.com/in/USERNAME">LinkedIn</a><a class="btn-b alt mb-2"
                        href="https://instagram.com/USERNAME">Instagram</a>
                </div>
                <div class="col-lg-6 rv">
                    <form id="mailform" class="card-b">
                        <input class="form-control mb-3" name="name" required data-ph="c_n" placeholder="Your name">
                        <input class="form-control mb-3" name="email" type="email" required data-ph="c_e"
                            placeholder="Your email">
                        <textarea class="form-control mb-3" name="msg" rows="5" required data-ph="c_m"
                            placeholder="Your message"></textarea>
                        <button class="btn-b red" type="submit" data-i18n="c_b">Send message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer class="py-4 mt-5">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span class="mono" data-i18n="f_t">Built by hand.</span>
            <span class="mono">&copy;
                <script>document.write(new Date().getFullYear())</script> Febri &middot; <a
                    href="https://github.com/USERNAME">GitHub</a>
            </span>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
